<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f7fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0f1c" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Coursera Clone: a full-stack learning platform with student, instructor and admin workspaces, built with React, TypeScript and Django."
    />
    <meta property="og:title" content="Coursera Clone" />
    <meta
      property="og:description"
      content="A full-stack learning platform: courses, quizzes, grading, certificates, messaging and subscriptions."
    />
    <meta property="og:type" content="website" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Coursera Clone</title>
    <script>
      // Apply the saved theme before the first paint, so a dark page never flashes white.
      // src/shared/theme/theme.ts owns the same key and rules once React runs.
      (function () {
        try {
          var saved = window.localStorage.getItem('theme');
          var dark =
            saved === 'dark' ||
            (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (error) {
          // no storage or no matchMedia: the light theme stays
        }
      })();
    </script>
  </head>
  <body>
    <noscript>This application needs JavaScript to run.</noscript>
    <div id="root"></div>
  </body>
</html>
