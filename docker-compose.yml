# Local infrastructure: PostgreSQL and Redis.
#
#   DB_PASSWORD=choose-something docker compose up -d
#
# then point backend/.env at it (DB_ENGINE=postgres, the same DB_* values and
# REDIS_URL=redis://localhost:6379/0).  The applications themselves run on the
# host: `python manage.py runserver` and `npm start`.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-coursera_db}
      POSTGRES_USER: ${DB_USER:-coursera_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD (any value) before starting}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-coursera_admin} -d ${DB_NAME:-coursera_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
