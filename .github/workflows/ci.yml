name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: coursera_db
          POSTGRES_USER: coursera_admin
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coursera_admin -d coursera_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_ENGINE: postgres
      TEST_DB_ENGINE: postgres
      DB_NAME: coursera_db
      DB_USER: coursera_admin
      DB_PASSWORD: ci-only-password
      DB_HOST: localhost
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check --select F apps config tests
      - name: Architecture contracts
        run: lint-imports
      - name: Django checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Tests (PostgreSQL)
        run: python -m pytest
      - name: Development data (migrate and seed twice, then reset)
        run: |
          python manage.py migrate
          python manage.py seed_dev --password ci-only-seed
          python manage.py seed_dev --password ci-only-seed
          python manage.py seed_dev --password ci-only-seed --reset

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (module boundaries included)
        run: npx eslint --ext .js,.jsx src
      - name: Tests
        run: CI=true npm test -- --watchAll=false
      - name: Build
        run: CI=false npm run build
