name: Set up a Node project
description: Node and pnpm with a pnpm store cache and the locked dependencies of one directory installed

inputs:
  directory:
    description: Directory with the package.json (its packageManager field names the pnpm version) and the pnpm-lock.yaml
    default: frontend
  node-version:
    description: Node major version
    default: "22"

runs:
  using: composite
  steps:
    # before setup-node: it asks pnpm where the store is when it sets up the cache
    - name: Set up pnpm (the version of the packageManager field of ${{ inputs.directory }})
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        package_json_file: ${{ inputs.directory }}/package.json

    - name: Set up Node ${{ inputs.node-version }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: ${{ inputs.directory }}/pnpm-lock.yaml

    - name: Install the locked dependencies of ${{ inputs.directory }}
      shell: bash
      working-directory: ${{ inputs.directory }}
      run: pnpm install --frozen-lockfile
